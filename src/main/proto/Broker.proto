syntax="proto3";

package com.JobController;

option java_package = "com.JobController";
option java_multiple_files = true;

service WorkerToController { //Functions to be implemented at Controller
    rpc registerNode(Node) returns (Cnf);
    rpc heartBeat(Node) returns (Cnf);
    rpc reportJobStatus(Job) returns (Cnf); //Worker reports Job Status to Controller
}

service ControllerToWorker {
    rpc getJobStatus(Job) returns (Job); //Controller asks for job status from worker
    rpc allocate(AllocationCommand) returns (Cnf);
    rpc cancelAllocated(JobRef) returns (Cnf);
}

message Node{
    optional int32 id=1;
    string hostname=2;
    NodeState state=3;
    int32 cpu=4;
    int32 mem=5;
    string agent_endpoint = 6;
    int64 disk_mb = 7;
    repeated GPUDevice gpu_devices = 8;
    map<string, string> labels = 9;

    // Phase 9: Worker membership / failure-detection fields.
    // worker_uuid: stable logical identity that survives process restarts.
    string worker_uuid = 10;
    // incarnation_id: unique token generated per worker-process start; monotonically
    //   increasing so that the controller can detect restarts.
    string incarnation_id = 11;
    // heartbeat_sequence: per-incarnation monotonic counter used to detect stale/
    //   duplicate heartbeats.
    int64 heartbeat_sequence = 12;
}

message GPUDevice {
    string id = 1;
    int64 memory_mb = 2;
}

enum PlacementOperator {
    EQUALS = 0;
    NOT_EQUALS = 1;
}

message PlacementConstraint {
    string key = 1;
    PlacementOperator operator = 2;
    string value = 3;
}

message JobRef {
    int32 id=1;
}

message AllocationCommand {
    int32 allocation_id=1; // idempotency key
    Job job=2;
    repeated string gpu_device_ids = 3;
}

enum JobState {
    PENDING=0;
    ALLOCATED=1;
    RUNNING=2;
    COMPLETED=3;
    HELD=4;
    CANCELLED=5;
    FAILED=6;
    LOST=7;
}

enum NodeState {
    AVAILABLE=0;
    NODE_ALLOCATED=1;
    DOWN=2;
    MAINTENANCE=3;
}

message Cnf {
    int32 job_id = 1;
    bool success = 2;
    int32 node_id = 3;
    string message = 4;
    JobState state = 5;
}

message Job {
    int32 id=1;
    string owner=2;
    JobState state=3;
    string description=4;
    int32 cpuRequested=5;
    int32 memRequested=6;
    int64 disk_mb_requested=7;
    int32 gpu_count_requested=8;
    int64 gpu_memory_mb_per_gpu=9;
    repeated PlacementConstraint placement_constraints = 10;
    string assigned_worker_id = 11;
    map<string, string> assigned_worker_labels = 12;
}
